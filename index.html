h1 .tt{display:flex;flex-direction:column;line-height:1;transform:skewX(-8deg);min-width:0}

.bar{display:flex;gap:8px}
input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}
input,select{background:rgba(4,10,40,.75)}input:focus,select:focus{outline:0;border-color:#ffe000;box-shadow:0 0 0 2px rgba(255,224,0,.25)}
::placeholder{color:var(--mu);opacity:1}
#q{flex:1}
nav{display:flex;gap:8px;padding:10px 14px 0;max-width:1100px;margin:auto}
nav a{padding:7px 14px;border-radius:8px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);text-decoration:none;font-weight:600}
nav a.on{background:var(--ac);color:var(--ab);border-color:var(--ac)}
main{padding:14px;max-width:1100px;margin:auto}
#app{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.c{background:rgba(8,18,64,.88);border:1px solid var(--ln);border-top:3px solid var(--y);border-radius:10px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.c:hover,.c:active{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 22px rgba(255,224,0,.22)}
.c.in{animation:cin .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i),8)*70ms)}

.im{position:relative;aspect-ratio:16/9;background:#050c2e;display:grid;place-items:center}
.im img{width:100%;height:100%;object-fit:contain;display:block}
.ph{color:var(--mu);font:700 40px "Barlow Condensed",sans-serif}
.no{position:absolute;left:8px;top:8px;background:var(--co);color:#000;font:700 16px "Barlow Condensed",sans-serif;padding:1px 9px;border-radius:5px}

.st small{display:block;margin-top:4px;text-align:center;font:600 17px Barlow,system-ui,sans-serif;letter-spacing:.5px}
.st{text-align:center;position:absolute;inset:0;display:grid;place-items:center;background:#000a;color:#fff;font:700 30px "Barlow Condensed",sans-serif;transform:rotate(-8deg)}
.bd{padding:10px 12px 12px}
h3{margin:0 0 8px;font:700 25px/1.1 "Barlow Condensed",sans-serif;text-align:center;text-transform:uppercase;letter-spacing:.6px;text-shadow:0 0 12px rgba(255,224,0,.35)}
h3 a{color:var(--y);text-decoration:underline;text-underline-offset:3px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.g small{display:block;color:var(--mu);font-size:12px}
.g b{font:700 20px "Barlow Condensed",sans-serif}
.n{color:var(--note)}.p{color:var(--pr)}.o{color:#8fd3ff}
.acts{display:flex;gap:8px;margin-top:10px}.acts>*{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:8px;font:600 15px Barlow,system-ui,sans-serif;text-decoration:none;cursor:pointer}.acts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wa{background:var(--ac);color:var(--ab);border:1px solid var(--ac)}.sh{background:var(--cd);color:var(--tx);border:1px solid rgba(255,224,0,.55)}
.wa{position:relative;overflow:hidden;box-shadow:0 0 14px rgba(255,224,0,.35)}.wa::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-150%) skewX(-20deg);animation:sw 3.2s ease-in-out infinite}
@keyframes sw{60%,100%{transform:translateX(350%) skewX(-20deg)}}
@media(prefers-reduced-motion:reduce){h1 b,h1 .lg,header::after,.wa::after,.c.in{animation:none}}.bk{color:var(--note);text-decoration:none;font-weight:600;padding:7px 0}
.dm{background:#2a475e;padding:8px 14px;text-align:center}
.adm{display:block;width:100%;margin-top:8px;padding:9px;border-radius:8px;border:1px solid #c0392b;background:#2a1414;color:#ff8a80;font:600 15px Barlow,system-ui,sans-serif}.adm:disabled{opacity:.6}
footer{max-width:1100px;margin:6px auto 30px;padding:0 14px;color:var(--mu);font-size:14px}
footer p{margin:6px 0}footer a{color:var(--note)}
@keyframes sp{to{transform:rotate(360deg)}}
h1 .lg{animation:pl 2.4s ease-in-out infinite,sp 8s linear infinite}

 return '<div class="tg">'+T.map((t,i)=>{const p=pic(t.gambar),cap=t.teks||t.nama&&t.nama!='Pembeli';
  return `<figure class="tmf${an?' in':''}" style="--i:${i}">${p?`<img class="tmi" src="${esc(p)}" alt="Testimoni ${i+1}" loading="lazy" referrerpolicy="no-referrer" onerror="tfb(this)">`:''}${cap?`<figcaption>${t.bintang?`<small style="color:var(--y)">${'★'.repeat(t.bintang)}</small>`:''}${t.teks?esc(t.teks):''}${t.nama&&t.nama!='Pembeli'?`<small>${esc(t.nama)}${t.tgl?' • '+esc(t.tgl):''}</small>`:''}</figcaption>`:''}</figure>`}).join('')+'</div>'}
function zoom(src){const d=document.createElement('div');d.className='lb';d.innerHTML='<img src="'+esc(src)+'" alt="">';d.onclick=()=>d.remove();document.body.appendChild(d)}
const gall=a=>{const f=fid(a.album),w=f&&GL[f];if(w&&w.length)return w;const g=[...new Set(gids(a.galeri))];return g.length?g:[...new Set(gids(a.gambar))]};
const gal=a=>{const ids=gall(a);if(ids.length)return ids.map(i=>gpic(i,2000));const p=pic(a.gambar);return p?[p]:[]};
async function loadG(){
 if(!GAL)return;
 const ids=[...new Set(D.filter(a=>!a.sold).map(a=>fid(a.album)).filter(Boolean))];if(!ids.length)return;
 try{const r=await fetch(GAL+(GAL.includes('?')?'&':'?')+'ids='+ids.join(','));const j=await r.json();
  if(j&&typeof j=='object'&&!j.error){const o=JSON.stringify(GL);GL={...GL,...j};const n=JSON.stringify(GL);
   if(n!=o){try{localStorage.setItem('gl',n)}catch(e){}render()}}}
 catch(e){}}
function lbox(list,start){
 if(!list.length)return;
 const d=document.createElement('div');d.className='lb2';
 d.innerHTML='<div class="lt"><span class="lc"></span><button class="lx" aria-label="Tutup">✕</button></div><div class="ls">'+list.map((u,i)=>'<div class="lp"><img src="'+esc(u)+'" alt="Gambar '+(i+1)+'" referrerpolicy="no-referrer"'+(i>1?' loading="lazy"':'')+' onerror="tfb(this)"></div>').join('')+'</div>'+(list.length>1?'<button class="lv pv" aria-label="Sebelumnya">‹</button><button class="lv nx" aria-label="Berikutnya">›</button>':'');
 const ls=d.querySelector('.ls'),lc=d.querySelector('.lc'),ob=document.body.style.overflow;
 const idx=()=>Math.max(0,Math.min(list.length-1,Math.round(ls.scrollLeft/(ls.clientWidth||1))));
 const upd=()=>{lc.textContent=list.length>1?(idx()+1)+' / '+list.length:''};
 const go=n=>ls.scrollBy({left:n*ls.clientWidth,behavior:'smooth'});
 const key=e=>{if(e.key=='Escape')close(true);else if(e.key=='ArrowRight')go(1);else if(e.key=='ArrowLeft')go(-1)};
 const pop=()=>close(false);
 function close(back){removeEventListener('keydown',key);removeEventListener('popstate',pop);d.remove();document.body.style.overflow=ob;if(back&&history.state&&history.state.lb)history.back()}
 ls.addEventListener('scroll',upd,{passive:true});
 d.onclick=e=>{if(e.target.closest('.lx')||e.target==d||e.target.classList.contains('lp')||e.target==ls)close(true);else if(e.target.closest('.pv'))go(-1);else if(e.target.closest('.nx'))go(1)};
 document.body.appendChild(d);document.body.style.overflow='hidden';
 ls.scrollLeft=(start||0)*ls.clientWidth;upd();
 history.pushState({lb:1},'');addEventListener('popstate',pop);addEventListener('keydown',key)}
function csv(t){const r=[];let c=[],f='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=h}else if(h=='"')q=true;else if(h==','){c.push(f);f=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;c.push(f);r.push(c);c=[];f=''}else f+=h}if(f||c.length){c.push(f);r.push(c)}return r}
function norm(o){return{no:num(o.no),nama:o.nama||'',noteT:String(o[NK]??''),note:num(o[NK]),harga:o.harga||'-',coin:num(o.coin),reg:o.reg||'ID',fe:/^(fe|ya|yes|true|1|✅)$/i.test((o.fe||'').trim()),sold:/jual|sold/i.test(o.status||''),steam:!/lain/i.test(o.platform||''),album:o.album||'',gambar:o.gambar||'',galeri:o.galeri||'',tgl:o.tanggal||'',testi:o.testimoni||o.testi||o.ulasan||'',testiImg:o.foto_testi||o['foto testi']||o.gambar_testi||'',pembeli:o.pembeli||'',bintang:Math.min(5,num(o.bintang))}}
async function load(){
 const tp=loadT();
 if(!CSV_URL){D=DEMO.map(norm);await tp;$('#dm').innerHTML='<div class="dm">Mode contoh: link Google Sheets belum diisi.</div>';return render()}
 try{const r=await fetch(CSV_URL+(CSV_URL.includes('?')?'&':'?')+'t='+Date.now());const rows=csv(await r.text()),h=rows[0].map(x=>x.trim().toLowerCase()),H0=rows[0].map(x=>x.trim());
  const ni=h.findIndex(k=>k&&!KN.includes(k));if(ni>=0){NK=h[ni];L.n=H0[ni].toUpperCase()}
  ['harga','coin','reg'].forEach(k=>{const i=h.indexOf(k);if(i>=0)L[k]=H0[i].toUpperCase()});
  AL=rows.slice(1).filter(x=>x.some(v=>v.trim())).map(x=>{const o={};h.forEach((k,i)=>o[k]=(x[i]||'').trim());return norm(o)});D=AL.filter(a=>a.nama&&!a.nama.startsWith('#'));
  try{const ov=JSON.parse(localStorage.getItem('ov')||'{}');D.forEach(a=>{const o=ov[a.no];if(o&&Date.now()-o.t<6e5)a.sold=o.s=='terjual'})}catch(e){}}
 catch(e){$('#app').innerHTML='<p>Katalog gagal dimuat. Coba muat ulang halaman.</p>';return}
 await tp;if(!TESTI_CSV)T=sortT(AL.filter(a=>!String(a.nama).startsWith('#')&&(a.testi||a.testiImg)).flatMap(mkT));render();loadG()}
function render(){
 const an=ANI;ANI=false;
 const q=$('#q').value.trim().toLowerCase(),s=$('#s').value,tab=location.hash=='#terjual'?'terjual':location.hash=='#testimoni'?'testimoni':'tersedia',TM=tab=='testimoni'&&!AK,tn=D.filter(a=>a.sold).length;
 $('#tb').innerHTML=AK?'<a class="bk" href="'+location.pathname+'">← Lihat semua akun</a>':`<a href="#tersedia" class="${tab=='tersedia'?'on':''}">Tersedia (${D.length-tn})</a><a href="#terjual" class="${tab=='terjual'?'on':''}">Terjual (${tn})</a><a href="#testimoni" class="${tab=='testimoni'?'on':''}">Testimoni (${T.length})</a>`;
 const bar=document.querySelector('.bar');if(bar)bar.style.display=TM?'none':'';
 const AKS=AK&&!D.some(a=>String(a.no)==AK&&!a.sold),V=D.filter(a=>(AK?String(a.no)==AK&&a.sold==AKS:a.sold==(tab=='terjual')&&a.nama.toLowerCase().includes(q))).sort((a,b)=>s=='note'?b.note-a.note:s=='price'?num(a.harga)-num(b.harga):a.no-b.no);
 $('#app').innerHTML=TM?testiHTML(an):V.length?V.map((a,i)=>{const fo=fid(a.gambar),fl=gall(a),p=fl[0]?gpic(fl[0]):pic(a.gambar);return`<article class="c${an?' in':''}" style="--i:${i}"><div class="im">${p?`<img data-no="${a.no}" src="${esc(p)}" alt="Squad ${esc(a.nama)}" loading="lazy" referrerpolicy="no-referrer" onerror="fb(this)">`:'<div class="ph">Squad</div>'}<span class="no">${a.no}</span>${fl.length>1?`<span class="cn">${fl.length} foto</span>`:''}${a.steam?`<span class="sb">${STEAM}Steam</span>`:''}${a.sold?`<div class="st"><span>TERJUAL${a.tgl?`<small>${esc(a.tgl)}</small>`:''}</span></div>`:''}</div><div class="bd"><h3>${ok(a.album)?`<a href="${esc(a.album)}" target="_blank" rel="noopener">${esc(a.nama)}</a>`:esc(a.nama)}</h3><div class="g"><div><small>${esc(L.n)}</small><b class="n">${esc(a.noteT)}</b></div><div><small>${esc(L.harga)}</small><b class="p">${esc(a.harga)}</b></div><div><small>${esc(L.coin)}</small><b class="o">${a.coin}</b></div><div><small>${esc(L.reg)}</small><b>${esc(a.reg)}${a.fe?' FE ✅':''}</b></div></div>${a.sold?'':`<div class="acts"><button class="sh" data-no="${a.no}">${IC_SH}Share</button><a class="wa" href="https://wa.me/${WA}?text=${encodeURIComponent('Halo, saya tertarik akun no '+a.no+' ('+a.nama+')')}" target="_blank" rel="noopener">${IC_CT}Order</a></div>`}${ADM&&APPS?`<button class="adm" data-no="${a.no}" data-s="${a.sold?'tersedia':'terjual'}">${a.sold?'Kembalikan ke Tersedia':'Tandai Terjual'}</button>`:''}</div></article>`}).join(''):'<p>Tidak ada akun yang cocok.</p>';
 $('#ft').innerHTML='<p>Klik nama pemain untuk melihat semua screenshot full squad.</p>'+(/note|nota|collective|strength/i.test(NK)?'<p>'+esc(L.n)+' = collective strength. FE = First Email.</p>':'<p>FE = First Email.</p>')+'<p>Email dan password akun Steam bisa diganti. Login hanya dengan Steam ID dan password Steam.</p><p>Akun yang sudah dibeli tidak dapat ditukar dengan akun lain.</p>'+(ok(TESTI)?`<p><a href="${esc(TESTI)}" target="_blank" rel="noopener">Lihat testimoni</a></p>`:'');
}
async function mark(no,st,b){
 let k=localStorage.getItem('k')||prompt('Password admin:');if(!k)return;
 if(!confirm((st=='terjual'?'Tandai TERJUAL':'Kembalikan ke TERSEDIA')+' akun no '+no+'?'))return;
 b.disabled=true;b.textContent='Menyimpan…';
 try{const r=await(await fetch(APPS+'?key='+encodeURIComponent(k)+'&no='+encodeURIComponent(no)+'&status='+st)).json();
  if(!r.ok){localStorage.removeItem('k');alert('Gagal: '+(r.error||'tidak diketahui'));return render()}
  localStorage.setItem('k',k);
  let ov={};try{ov=JSON.parse(localStorage.getItem('ov')||'{}')}catch(e){}
  ov[no]={s:st,t:Date.now()};localStorage.setItem('ov',JSON.stringify(ov));
  D.forEach(a=>{if(String(a.no)==String(no))a.sold=st=='terjual'});render()}
 catch(e){alert('Gagal terhubung ke Apps Script.');render()}}
async function share(no){const a=D.find(x=>String(x.no)==String(no));if(!a)return;
 const u=location.origin+location.pathname+'?akun='+a.no,t='Akun eFootball no '+a.no+' ('+a.nama+') - '+a.harga;
 try{if(navigator.share)await navigator.share({title:a.nama,text:t,url:u});else{await navigator.clipboard.writeText(t+'\n'+u);alert('Link disalin')}}catch(e){}}
$('#app').onclick=e=>{const b=e.target.closest('.adm'),h=e.target.closest('.sh'),z=e.target.closest('.tmi'),g=e.target.closest('.im img');if(b)mark(b.dataset.no,b.dataset.s,b);else if(h)share(h.dataset.no);else if(z)zoom(z.currentSrc||z.src);else if(g){const a=D.find(x=>String(x.no)==g.dataset.no);if(a)lbox(gal(a),0)}};
$('#q').oninput=$('#s').onchange=render;addEventListener('hashchange',()=>{ANI=true;render()});
const hh=()=>document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');
hh();addEventListener('resize',hh);if(window.ResizeObserver)new ResizeObserver(hh).observe(document.querySelector('header'));if(document.fonts&&document.fonts.ready)document.fonts.ready.then(hh);
load();
</script></body></html>
